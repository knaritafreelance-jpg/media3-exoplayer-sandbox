[versions]
agp = "9.0.0"
coreKtx = "1.17.0"
activityKtx = "1.11.0"
media3 = "1.8.0"
junit = "4.13.2"
androidxJunit = "1.3.0"
espressoCore = "3.7.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
